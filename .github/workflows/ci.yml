name: CI
on:
  push:
  pull_request:

# Tests and builds only. Nothing here deploys to production.
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: churn_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Model metadata is in sync with the trained model
        run: python scripts/evaluate_model.py --check
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Tests (PostgreSQL, schema built from Alembic migrations)
        run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/churn_test

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ./backend, push: false, tags: churn-backend:ci, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: ./frontend, push: false, tags: churn-frontend:ci, cache-from: type=gha, cache-to: "type=gha,mode=max" }

  smoke:
    name: End-to-end smoke (Next.js -> FastAPI -> model -> PostgreSQL)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: churn }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/churn
      ENVIRONMENT: staging
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://localhost:3000
      TRUST_PROXY_HEADERS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Migrate and create a throw-away admin
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.cli create-admin --email ci-admin@example.com --name "CI Admin"
        env:
          ADMIN_PASSWORD: ${{ format('Ci-{0}-Adm1n', github.run_id) }}
      - name: Start API and web
        run: |
          (cd backend && nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &)
          (cd frontend && BACKEND_URL=http://127.0.0.1:8000 nohup npx next start -p 3000 > /tmp/web.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:8000/api/v1/health/ready && curl -sf localhost:3000/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/api.log /tmp/web.log; exit 1
      - name: Smoke test
        run: python scripts/smoke_test.py
        env:
          BASE_URL: http://localhost:3000
          SMOKE_ADMIN_EMAIL: ci-admin@example.com
          SMOKE_ADMIN_PASSWORD: ${{ format('Ci-{0}-Adm1n', github.run_id) }}
