# Adds a Caddy reverse proxy with automatic HTTPS in front of the web app.
#   docker compose -f docker-compose.yml -f deploy/docker-compose.https.yml up -d --build
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. churn.yourdomain.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
